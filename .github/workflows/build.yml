name: Build IPA
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Build unsigned
        run: |
          xcodebuild -project JDLite.xcodeproj -scheme JDLite -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/JDLite.app Payload/
          zip -qr JDLite.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: JDLite-ipa
          path: JDLite.ipa
