name: Build unsigned IPA

# Manual only: tap "Run workflow" in the Actions tab.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Build (no code signing)
        run: |
          xcodebuild -project JDLite.xcodeproj -scheme JDLite \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          OUT=build/Build/Products/Release-iphoneos
          APP="$OUT/JDLite.app"
          EXT="$OUT/JDLiteExtension.appex"
          test -d "$APP"
          test -d "$EXT"

          # Safari only loads the extension if these sit at the top of the .appex.
          for f in manifest.json popup.html popup.js popup.css content.js \
                   icon-48.png icon-128.png icon-512.png toolbar-icon-38.png; do
            if [ ! -f "$EXT/$f" ]; then
              echo "::error::$f is missing from the top level of the Safari extension"
              find "$EXT" -maxdepth 2 -print
              exit 1
            fi
          done

          rm -rf Payload JDLite.ipa
          mkdir Payload
          ditto "$APP" Payload/JDLite.app

          # The app icon is compiled from Assets.xcassets into the app's Info.plist.
          if ! plutil -p Payload/JDLite.app/Info.plist | grep -q CFBundleIcons; then
            echo "::error::The app icon wasn't compiled into the app"
            exit 1
          fi
          if ! plutil -p Payload/JDLite.app/Info.plist | grep -q NSSupportsLiveActivities; then
            echo "::error::Live Activities aren't switched on in the app's Info.plist"
            exit 1
          fi
          echo "App: $(plutil -extract CFBundleIdentifier raw Payload/JDLite.app/Info.plist)"

          # iOS only finds extensions in a folder named exactly "PlugIns". This Mac
          # ignores letter case, so no other folder in the app may be called "plugins".
          CLASH=$(ls Payload/JDLite.app | grep -ix "plugins" || true)
          if [ -n "$CLASH" ] && [ "$CLASH" != "PlugIns" ]; then
            echo "::error::The app has a folder called '$CLASH', which clashes with PlugIns"
            exit 1
          fi
          mkdir -p Payload/JDLite.app/PlugIns
          # Safari extension, widget extension (Live Activity) and share extension.
          for name in JDLiteExtension JDLiteWidgets JDLiteShare; do
            if [ ! -f "$OUT/$name.appex/Info.plist" ]; then
              echo "::error::$name.appex wasn't built"
              exit 1
            fi
            ditto "$OUT/$name.appex" "Payload/JDLite.app/PlugIns/$name.appex"
            echo "$name: $(plutil -extract CFBundleIdentifier raw "$OUT/$name.appex/Info.plist")"
          done

          zip -qr JDLite.ipa Payload
          for f in JDLiteExtension.appex/manifest.json JDLiteWidgets.appex/Info.plist JDLiteShare.appex/Info.plist; do
            if ! unzip -l JDLite.ipa | grep -q "Payload/JDLite.app/PlugIns/$f"; then
              echo "::error::$f isn't in the IPA's PlugIns folder"
              unzip -l JDLite.ipa | grep -i "appex" | head -n 20
              exit 1
            fi
          done
          echo "Packaged the app with its Safari extension, Live Activity widget and share extension"

      - uses: actions/upload-artifact@v6
        with:
          name: JDLite-unsigned-ipa
          path: JDLite.ipa
          compression-level: 0
