name: Build unsigned IPA

# Manual only: tap "Run workflow" in the Actions tab.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Build (no code signing)
        run: |
          xcodebuild -project JDLite.xcodeproj -scheme JDLite \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          OUT=build/Build/Products/Release-iphoneos
          test -d "$OUT/JDLite.app"
          test -d "$OUT/JDLiteExtension.appex"
          mkdir -p "$OUT/JDLite.app/PlugIns"
          cp -R "$OUT/JDLiteExtension.appex" "$OUT/JDLite.app/PlugIns/"
          mkdir Payload
          cp -R "$OUT/JDLite.app" Payload/
          zip -qry JDLite.ipa Payload
          unzip -l JDLite.ipa | grep -E "Info.plist|\.appex/" | head -n 10

      - uses: actions/upload-artifact@v6
        with:
          name: JDLite-unsigned-ipa
          path: JDLite.ipa
          compression-level: 0
