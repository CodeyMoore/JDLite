name: Build unsigned IPA

# Manual only: tap "Run workflow" in the Actions tab.
on:
  workflow_dispatch:

# Each successful build saves its version number to version.txt in the repo.
permissions:
  contents: write

# Two builds at once would get the same number, so a second one waits its turn.
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      # Every build goes up one: 1.6, 1.7 ... 1.9, 2.0, and the build number goes up by one.
      # version.txt holds the last build's numbers. Without it, they come from project.yml.
      - name: Set the version number
        run: |
          if [ -f version.txt ]; then
            LAST_VERSION=$(sed -n 's/^version:[[:space:]]*//p' version.txt | head -n 1 | tr -d '[:space:]')
            LAST_BUILD=$(sed -n 's/^build:[[:space:]]*//p' version.txt | head -n 1 | tr -d '[:space:]')
          else
            LAST_VERSION=$(sed -n 's/.*CFBundleShortVersionString:[[:space:]]*"\([^"]*\)".*/\1/p' project.yml | head -n 1)
            LAST_BUILD=$(sed -n 's/.*CFBundleVersion:[[:space:]]*"\([^"]*\)".*/\1/p' project.yml | head -n 1)
          fi
          if ! echo "$LAST_VERSION" | grep -Eq '^[0-9]+\.[0-9]+$' || ! echo "$LAST_BUILD" | grep -Eq '^[0-9]+$'; then
            echo "::error::Couldn't read the last version (found '$LAST_VERSION' and build '$LAST_BUILD'). version.txt should look like: version: 1.6 / build: 13"
            exit 1
          fi
          MAJOR=${LAST_VERSION%%.*}
          MINOR=${LAST_VERSION#*.}
          MINOR=$((10#$MINOR + 1))
          if [ "$MINOR" -ge 10 ]; then
            MAJOR=$((10#$MAJOR + 1))
            MINOR=0
          fi
          VERSION="$MAJOR.$MINOR"
          BUILD=$((10#$LAST_BUILD + 1))

          # The app and all its extensions get the same numbers.
          VERSION="$VERSION" BUILD="$BUILD" perl -pi -e \
            's/(CFBundleShortVersionString:\s*)"[^"]*"/$1"$ENV{VERSION}"/; s/(CFBundleVersion:\s*)"[^"]*"/$1"$ENV{BUILD}"/' \
            project.yml
          TARGETS=$(grep -c 'CFBundleShortVersionString:' project.yml)
          if [ "$(grep -c "CFBundleShortVersionString: \"$VERSION\"" project.yml)" != "$TARGETS" ] \
             || [ "$(grep -c "CFBundleVersion: \"$BUILD\"" project.yml)" != "$TARGETS" ]; then
            echo "::error::Couldn't set the version number in project.yml"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "### JDLite $VERSION ($BUILD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Building JDLite $VERSION ($BUILD), after $LAST_VERSION ($LAST_BUILD)"

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Build (no code signing)
        run: |
          xcodebuild -project JDLite.xcodeproj -scheme JDLite \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          OUT=build/Build/Products/Release-iphoneos
          APP="$OUT/JDLite.app"
          EXT="$OUT/JDLiteExtension.appex"
          test -d "$APP"
          test -d "$EXT"

          # Safari only loads the extension if these sit at the top of the .appex.
          for f in manifest.json popup.html popup.js popup.css content.js \
                   icon-48.png icon-128.png icon-512.png toolbar-icon-38.png; do
            if [ ! -f "$EXT/$f" ]; then
              echo "::error::$f is missing from the top level of the Safari extension"
              find "$EXT" -maxdepth 2 -print
              exit 1
            fi
          done

          rm -rf Payload JDLite.ipa
          mkdir Payload
          ditto "$APP" Payload/JDLite.app

          # The app icon is compiled from Assets.xcassets into the app's Info.plist.
          if ! plutil -p Payload/JDLite.app/Info.plist | grep -q CFBundleIcons; then
            echo "::error::The app icon wasn't compiled into the app"
            exit 1
          fi
          if ! plutil -p Payload/JDLite.app/Info.plist | grep -q NSSupportsLiveActivities; then
            echo "::error::Live Activities aren't switched on in the app's Info.plist"
            exit 1
          fi
          echo "App: $(plutil -extract CFBundleIdentifier raw Payload/JDLite.app/Info.plist)"

          # iOS only finds extensions in a folder named exactly "PlugIns". This Mac
          # ignores letter case, so no other folder in the app may be called "plugins".
          CLASH=$(ls Payload/JDLite.app | grep -ix "plugins" || true)
          if [ -n "$CLASH" ] && [ "$CLASH" != "PlugIns" ]; then
            echo "::error::The app has a folder called '$CLASH', which clashes with PlugIns"
            exit 1
          fi
          mkdir -p Payload/JDLite.app/PlugIns
          # Safari extension, widget extension (Live Activity) and share extension.
          for name in JDLiteExtension JDLiteWidgets JDLiteShare; do
            if [ ! -f "$OUT/$name.appex/Info.plist" ]; then
              echo "::error::$name.appex wasn't built"
              exit 1
            fi
            ditto "$OUT/$name.appex" "Payload/JDLite.app/PlugIns/$name.appex"
            echo "$name: $(plutil -extract CFBundleIdentifier raw "$OUT/$name.appex/Info.plist")"
          done

          # Ad-hoc ("fake") signature with entitlements, so jailbroken devices with AppSync
          # Unified (Filza and the like) accept the IPA: installing fails without an
          # application-identifier entitlement. Real signing (Flarestore, Sideloadly) replaces it.
          fakesign() {  # $1 = bundle to sign
            ID=$(plutil -extract CFBundleIdentifier raw "$1/Info.plist")
            ENT=$(mktemp)
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict>' \
              "<key>application-identifier</key><string>$ID</string>" \
              "<key>keychain-access-groups</key><array><string>$ID</string></array>" \
              '<key>get-task-allow</key><true/>' \
              '</dict></plist>' > "$ENT"
            codesign -f -s - --entitlements "$ENT" "$1"
            SIGNED=$(codesign -d --entitlements - "$1" 2>&1)
            case "$SIGNED" in
              *"$ID"*) echo "Fake-signed $(basename "$1") as $ID" ;;
              *) echo "::error::$(basename "$1") wasn't signed with its application-identifier"; exit 1 ;;
            esac
          }
          signframeworks() {  # $1 = bundle whose Frameworks folder to sign, if it has one
            if [ -d "$1/Frameworks" ]; then
              find "$1/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -print0 |
                while IFS= read -r -d '' f; do codesign -f -s - "$f"; done
            fi
          }
          # Inside out: frameworks and extensions first, the app last (it seals them).
          for name in JDLiteExtension JDLiteWidgets JDLiteShare; do
            signframeworks "Payload/JDLite.app/PlugIns/$name.appex"
            fakesign "Payload/JDLite.app/PlugIns/$name.appex"
          done
          signframeworks Payload/JDLite.app
          fakesign Payload/JDLite.app
          if ! codesign --verify --deep --strict Payload/JDLite.app; then
            echo "::error::The fake signature didn't verify"
            exit 1
          fi

          zip -qr JDLite.ipa Payload
          for f in JDLiteExtension.appex/manifest.json JDLiteWidgets.appex/Info.plist JDLiteShare.appex/Info.plist; do
            if ! unzip -l JDLite.ipa | grep -q "Payload/JDLite.app/PlugIns/$f"; then
              echo "::error::$f isn't in the IPA's PlugIns folder"
              unzip -l JDLite.ipa | grep -i "appex" | head -n 20
              exit 1
            fi
          done
          echo "Packaged the app with its Safari extension, Live Activity widget and share extension"
          mv JDLite.ipa "JDLite-$VERSION.ipa"

      - uses: actions/upload-artifact@v6
        with:
          name: JDLite-${{ env.VERSION }}-unsigned-ipa
          path: JDLite-${{ env.VERSION }}.ipa
          compression-level: 0

      # Only a build that worked uses up a number. Saving it here means the next build
      # goes up from this one.
      - name: Save the version number
        run: |
          git checkout -- project.yml
          printf 'version: %s\nbuild: %s\n' "$VERSION" "$BUILD" > version.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -q -m "Version $VERSION ($BUILD)"
          for attempt in 1 2 3; do
            if git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Saved version $VERSION ($BUILD) to version.txt"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::The IPA is fine, but version.txt couldn't be saved, so the next build will get $VERSION again"
