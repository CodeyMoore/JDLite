name: Build unsigned IPA

# Manual only: tap "Run workflow" in the Actions tab.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Build (no code signing)
        run: |
          xcodebuild -project JDLite.xcodeproj -scheme JDLite \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          OUT=build/Build/Products/Release-iphoneos
          APP="$OUT/JDLite.app"
          APPEX="$OUT/JDLiteExtension.appex"
          test -d "$APP"
          test -d "$APPEX"

          # Safari only loads the extension if these sit at the top of the .appex.
          for f in manifest.json popup.html popup.js popup.css content.js; do
            if [ ! -f "$APPEX/$f" ]; then
              echo "::error::$f is missing from the top level of the Safari extension"
              find "$APPEX" -maxdepth 2 -print
              exit 1
            fi
          done
          plutil -p "$APPEX/Info.plist" | grep -E "CFBundleIdentifier|NSExtensionPointIdentifier|NSExtensionPrincipalClass"

          mkdir -p "$APP/PlugIns"
          rm -rf "$APP/PlugIns/JDLiteExtension.appex"
          cp -R "$APPEX" "$APP/PlugIns/"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry JDLite.ipa Payload
          unzip -l JDLite.ipa | grep "PlugIns/JDLiteExtension.appex/manifest.json"

      - uses: actions/upload-artifact@v6
        with:
          name: JDLite-unsigned-ipa
          path: JDLite.ipa
          compression-level: 0
