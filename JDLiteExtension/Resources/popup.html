<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="icon-96.png" alt="">
      <strong>JDLite</strong>
      <span id="summary" class="summary"></span>
    </div>
    <input id="q" type="search" placeholder="Filter files" hidden>
  </header>
  <p id="message">Looking for download files…</p>
  <ul id="list"></ul>
  <footer id="actions" hidden>
    <div class="row">
      <button id="toggle">Select none</button>
      <span id="count">0 selected</span>
    </div>
    <div class="row">
      <a id="send" class="btn primary disabled" href="#">Send to JDLite</a>
      <button id="copy">Copy links</button>
    </div>
  </footer>
  <a id="page" class="link" href="#" hidden>Send this page's URL instead</a>
  <script src="popup.js"></script>
</body>
</html>
