<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <input id="q" type="search" placeholder="Filter links">
    <div id="chips">
      <button data-filter="files">Files</button>
      <button data-filter="media">Media</button>
      <button data-filter="images">Images</button>
      <button data-filter="all">All</button>
    </div>
  </header>
  <p id="status"></p>
  <ul id="list"></ul>
  <footer>
    <div class="row">
      <button id="toggle">Select all</button>
      <span id="count">0 selected</span>
    </div>
    <div class="row">
      <a id="send" class="btn primary disabled" href="#">Send to JDLite</a>
      <button id="copy">Copy</button>
    </div>
    <a id="page" class="link" href="#">Send this page's URL</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
