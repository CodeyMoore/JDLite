name: JDLite
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  JDLite:
    type: application
    platform: iOS
    sources:
      - path: JDLite
        excludes: ["Plugins/**"]
      - path: JDLite/Plugins
        type: folder
    dependencies:
      - target: JDLiteExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.jdlite
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: JDLite/Info.plist
      properties:
        CFBundleDisplayName: JDLite
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.example.jdlite
            CFBundleURLSchemes: [jdlite]
  JDLiteExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: JDLiteExtension
        excludes: ["Resources/**", "Info.plist"]
      - path: JDLiteExtension/Resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.jdlite.extension
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: JDLiteExtension/Info.plist
      properties:
        CFBundleDisplayName: JDLite
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
