name: JDLite
options:
  bundleIdPrefix: com.codeymoore
  deploymentTarget:
    iOS: "17.0"
targets:
  JDLite:
    type: application
    platform: iOS
    sources:
      - path: JDLite
        excludes: ["BuiltInPlugins/**", "Plugins/**"]
      # Bundled JS plugins. Not named "Plugins": the build machine ignores letter
      # case, so it would clash with the app's "PlugIns" extension folder.
      - path: JDLite/BuiltInPlugins
        type: folder
      - path: Shared
    dependencies:
      # CI copies both extensions into the app by hand (see build.yml).
      - target: JDLiteExtension
        embed: false
      - target: JDLiteWidgets
        embed: false
      - target: JDLiteShare
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codeymoore.jdlite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: JDLite/Info.plist
      properties:
        CFBundleDisplayName: JDLite
        CFBundleShortVersionString: "1.6"
        CFBundleVersion: "12"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSSupportsLiveActivities: true
        # Lets "Full Speed in Background" keep JDLite awake while it downloads.
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.codeymoore.jdlite
            CFBundleURLSchemes: [jdlite]
        # .torrent files: "Open in JDLite" from the Files app and the share sheet.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [torrent]
              public.mime-type: [application/x-bittorrent]
        CFBundleDocumentTypes:
          - CFBundleTypeName: BitTorrent file
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.bittorrent.torrent]
  JDLiteExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: JDLiteExtension/SafariWebExtensionHandler.swift
      # Added as individual files (not a folder reference): Safari only loads
      # the extension if manifest.json is at the top level of the .appex.
      - path: JDLiteExtension/Resources
        buildPhase: resources
    settings:
      base:
        # Extension IDs must start with the app's bundle ID.
        PRODUCT_BUNDLE_IDENTIFIER: com.codeymoore.jdlite.extension
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: JDLiteExtension/Info.plist
      properties:
        CFBundleDisplayName: JDLite
        CFBundleShortVersionString: "1.6"
        CFBundleVersion: "12"
        # The extension checks links on any site (some still use plain http).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
  JDLiteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: JDLiteWidgets/JDLiteWidgets.swift
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codeymoore.jdlite.widgets
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: "YES"
    info:
      path: JDLiteWidgets/Info.plist
      properties:
        CFBundleDisplayName: JDLite
        CFBundleShortVersionString: "1.6"
        CFBundleVersion: "12"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  JDLiteShare:
    type: app-extension
    platform: iOS
    sources:
      - path: JDLiteShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codeymoore.jdlite.share
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: JDLiteShare/Info.plist
      properties:
        CFBundleDisplayName: JDLite
        CFBundleShortVersionString: "1.6"
        CFBundleVersion: "12"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Shows up for links, text with links in it, and .torrent files.
            NSExtensionActivationRule: >-
              SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.bittorrent.torrent"
              ).@count >= 1).@count >= 1
