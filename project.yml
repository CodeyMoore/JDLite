name: JDLite
options:
  bundleIdPrefix: com.codeymoore
  deploymentTarget:
    iOS: "17.0"
targets:
  JDLite:
    type: application
    platform: iOS
    sources:
      - path: JDLite
        excludes: ["BuiltInPlugins/**", "Plugins/**"]
      # Bundled JS plugins. Not named "Plugins": the build machine ignores letter
      # case, so it would clash with the app's "PlugIns" extension folder.
      - path: JDLite/BuiltInPlugins
        type: folder
    dependencies:
      - target: JDLiteExtension
        embed: false   # CI copies the .appex into the app by hand (see build.yml)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codeymoore.jdlite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: JDLite/Info.plist
      properties:
        CFBundleDisplayName: JDLite
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.codeymoore.jdlite
            CFBundleURLSchemes: [jdlite]
  JDLiteExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: JDLiteExtension/SafariWebExtensionHandler.swift
      # Added as individual files (not a folder reference): Safari only loads
      # the extension if manifest.json is at the top level of the .appex.
      - path: JDLiteExtension/Resources
        buildPhase: resources
    settings:
      base:
        # Must stay the app's bundle ID + ".extension"
        PRODUCT_BUNDLE_IDENTIFIER: com.codeymoore.jdlite.extension
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: JDLiteExtension/Info.plist
      properties:
        CFBundleDisplayName: JDLite
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
