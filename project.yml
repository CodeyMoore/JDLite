name: JDLite
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  JDLite:
    type: application
    platform: iOS
    sources:
      - path: JDLite
        excludes: ["Plugins/**"]
      - path: JDLite/Plugins
        type: folder
    dependencies:
      - target: JDLiteExtension
        embed: false   # CI copies the .appex into the app by hand (see build.yml)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.jdlite
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: JDLite/Info.plist
      properties:
        CFBundleDisplayName: JDLite
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.example.jdlite
            CFBundleURLSchemes: [jdlite]
  JDLiteExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: JDLiteExtension/SafariWebExtensionHandler.swift
      # Added as individual files (not a folder reference): Safari only loads
      # the extension if manifest.json is at the top level of the .appex.
      - path: JDLiteExtension/Resources
        buildPhase: resources
    settings:
      base:
        # Must stay the app's bundle ID + ".extension"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.jdlite.extension
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: JDLiteExtension/Info.plist
      properties:
        CFBundleDisplayName: JDLite
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
